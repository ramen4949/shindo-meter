<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リアルタイム計測震度計</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            background-color: #f0f2f5;
            padding: 20px;
            margin: 0;
            color: #333;
            transition: background-color 0.1s ease;
        }
        @keyframes flash {
            0% { background-color: #f0f2f5; }
            50% { background-color: #ffcccc; }
            100% { background-color: #f0f2f5; }
        }
        body.alarm-active {
            animation: flash 0.4s infinite;
        }
        .container {
            max-width: 420px;
            margin: 20px auto;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: left;
        }
        h2 { margin-top: 0; font-size: 22px; color: #222; text-align: center; }
        button {
            font-size: 16px;
            padding: 14px 28px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            box-shadow: 0 4px 12px rgba(0,123,255,0.3);
            transition: all 0.2s;
            margin-bottom: 15px;
        }
        button:active { transform: scale(0.98); }
        .result-box {
            margin: 25px 0;
            padding: 20px;
            background: #fafafa;
            border-radius: 12px;
            border: 1px solid #eee;
            text-align: center;
        }
        .label { font-size: 14px; color: #666; font-weight: 500; }
        #shindo-class {
            font-size: 76px;
            font-weight: 900;
            color: #ef4444;
            margin: 10px 0;
            line-height: 1;
        }
        #shindo-val { font-size: 22px; color: #333; font-weight: bold; }
        
        .graph-container {
            margin: 15px 0;
            background: #ffffff;
            border: 1px solid #ddd;
            border-radius: 12px;
            overflow: hidden;
        }
        canvas { display: block; width: 100%; height: 120px; }

        .metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        .metric-card { background: #f8f9fa; padding: 10px; border-radius: 10px; border: 1px solid #eee; text-align: center; }
        .metric-card div { color: #666; font-size: 12px; margin-bottom: 2px; }
        .metric-card span { font-size: 16px; font-weight: bold; color: #111; font-family: monospace; }
        
        .settings-panel {
            background: #f8f9fa;
            border: 1px solid #eee;
            border-radius: 15px;
            padding: 15px;
            margin-top: 15px;
        }
        .settings-title { font-size: 14px; font-weight: bold; color: #007bff; margin-bottom: 12px; border-bottom: 1px solid #ddd; padding-bottom: 5px; }
        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 13px;
        }
        .setting-item label { color: #333; }
        .setting-item input[type="range"], .setting-item select {
            width: 140px;
            background: white;
            color: #333;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 3px;
        }
        .btn-sm { padding: 5px 10px; font-size: 12px; width: auto; margin: 0; background-color: #64748b; color: white;}
        .btn-sm:hover { background-color: #475569; }
    </style>
</head>
<body>

<div class="container">
    <h2>計測震度システム</h2>
    <button id="start-btn" onclick="initSystem()">震度計モジュールを起動</button>

    <div class="result-box">
        <span class="label">現在のリアルタイム震度</span>
        <div id="shindo-class">-</div>
        <div id="shindo-val">計測震度: --</div>
    </div>

    <!-- リアルタイムグラフ -->
    <div class="graph-container">
        <canvas id="wave-graph"></canvas>
    </div>

    <div class="metrics">
        <div class="metric-card">
            <div>ハード生データ (Gal)</div>
            <span id="raw-gal">0.00</span>
        </div>
        <div class="metric-card">
            <div>地震動成分 (Gal)</div>
            <span id="filtered-gal">0.00</span>
        </div>
    </div>

    <!-- 設定パネル -->
    <div class="settings-panel">
        <div class="settings-title">⚙️ システム設定</div>
        
        <div class="setting-item">
            <label for="volume-slider">🔊 警告音量 (<span id="vol-txt">50</span>%)</label>
            <div style="display:flex; align-items:center; gap:5px;">
                <input type="range" id="volume-slider" min="0" max="100" value="50" oninput="updateSettings()">
                <button class="btn-sm" onclick="testAlertAudio()">テスト</button>
            </div>
        </div>

        <div class="setting-item">
            <label for="threshold-select">🚨 警告作動しきい値</label>
            <select id="threshold-select" onchange="updateSettings()">
                <option value="1">震度1以上</option>
                <option value="2">震度2以上</option>
                <option value="3" selected>震度3以上</option>
                <option value="4">震度4以上</option>
                <option value="5弱">震度5弱以上</option>
            </select>
        </div>
    </div>
</div>

<script>
// グラフ用バッファ（削られないよう完全個別の独立変数に変更）
var g0=0,g1=0,g2=0,g3=0,g4=0,g5=0,g6=0,g7=0,g8=0,g9=0;
var g10=0,g11=0,g12=0,g13=0,g14=0,g15=0,g16=0,g17=0,g18=0,g19=0;
var g20=0,g21=0,g22=0,g23=0,g24=0,g25=0,g26=0,g27=0,g28=0,g29=0;
var g30=0,g31=0,g32=0,g33=0,g34=0,g35=0,g36=0,g37=0,g38=0,g39=0;
var g40=0,g41=0,g42=0,g43=0,g44=0,g45=0,g46=0,g47=0,g48=0,g49=0;

// タイピング振動を丸めるための直近データ変数
var lastX1 = 0, lastX2 = 0, lastX3 = 0, lastX4 = 0;
var lastY1 = 0, lastY2 = 0, lastY3 = 0, lastY4 = 0;
var lastZ1 = 0, lastZ2 = 0, lastZ3 = 0, lastZ4 = 0;

var canvas = document.getElementById('wave-graph');
var ctx = canvas.getContext('2d');

var audioCtx = null;
var isSystemRunning = false;

var config = {
    volume: 0.5,
    threshold: 2.5 
};

var thresholdMap = { "1": 0.5, "2": 1.5, "3": 2.5, "4": 3.5, "5弱": 4.5 };

function updateSettings() {
    var volVal = document.getElementById('volume-slider').value;
    document.getElementById('vol-txt').innerText = volVal;
    config.volume = volVal / 100;

    var thresClass = document.getElementById('threshold-select').value;
    config.threshold = thresholdMap[thresClass];
}

function initSystem() {
    if (typeof AudioContext !== 'undefined' || typeof webkitAudioContext !== 'undefined') {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        DeviceMotionEvent.requestPermission()
            .then(function(permissionState) {
                if (permissionState === 'granted') { startSeismometer(); } 
                else { alert('センサーの許可が必要です。'); }
            }).catch(console.error);
    } else {
        startSeismometer();
    }
}
function startSeismometer() {
    isSystemRunning = true;
    document.getElementById('start-btn').style.display = 'none';
    
    requestAnimationFrame(drawGraph);

    window.addEventListener('devicemotion', function(event) {
        var rx = event.acceleration.x || 0;
        var ry = event.acceleration.y || 0;
        var rz = event.acceleration.z || 0;

        // 1. ハードウェア生の合成加速度を即座に算出
        var rawGal = Math.sqrt(rx*rx + ry*ry + rz*rz) * 100;
        if (isNaN(rawGal) || !isFinite(rawGal)) { rawGal = 0; }

        // 2. 移動平均フィルター（キーボードの細かなガタガタ衝撃を遮断）
        var fx = (rx + lastX1 + lastX2 + lastX3 + lastX4) / 5;
        var fy = (ry + lastY1 + lastY2 + lastY3 + lastY4) / 5;
        var fz = (rz + lastZ1 + lastZ2 + lastZ3 + lastZ4) / 5;

        // 過去のセンサー値を更新
        lastX4 = lastX3; lastX3 = lastX2; lastX2 = lastX1; lastX1 = rx;
        lastY4 = lastY3; lastY3 = lastY2; lastY2 = lastY1; lastY1 = ry;
        lastZ4 = lastZ3; lastZ3 = lastZ2; lastZ2 = lastZ1; lastZ1 = rz;

        // 3. フィルター通過後の地震動成分を算出
        var filteredGal = Math.sqrt(fx*fx + fy*fy + fz*fz) * 100;
        if (isNaN(filteredGal) || !isFinite(filteredGal)) { filteredGal = 0; }
        if (filteredGal > 2000) { filteredGal = 2000; }

        // グラフ用の独立変数を1ステップずつ手動でシフト更新
        g0=g1; g1=g2; g2=g3; g3=g4; g4=g5; g5=g6; g6=g7; g7=g8; g8=g9; g9=g10;
        g10=g11; g11=g12; g12=g13; g13=g14; g14=g15; g15=g16; g16=g17; g17=g18; g18=g19; g19=g20;
        g20=g21; g21=g22; g22=g23; g23=g24; g24=g25; g25=g26; g26=g27; g27=g28; g28=g29; g29=g30;
        g30=g31; g31=g32; g32=g33; g33=g34; g34=g35; g35=g36; g36=g37; g37=g38; g38=g39; g39=g40;
        g40=g41; g41=g42; g43=g44; g44=g45; g45=g46; g46=g47; g47=g48; g48=g49; g49=filteredGal;

        // 4. 最新の地震動成分（filteredGal）からダイレクトに計測震度を算出
        var currentShindo = -1.0;
        if (filteredGal >= 0.01) { 
            var logVal = Math.log10(filteredGal);
            if (isFinite(logVal)) {
                currentShindo = 2.0 * logVal + 0.50; 
            }
        }

        // 安全上限・下限ガード
        if (isNaN(currentShindo) || !isFinite(currentShindo) || currentShindo < -1.0) {
            currentShindo = -1.0;
        }
        if (currentShindo > 7.0) { currentShindo = 7.0; }

        // アラーム判定（その瞬間の震度がしきい値を超えている場合のみ作動）
        if (currentShindo >= config.threshold) {
            triggerAlarm();
        } else {
            stopAlarmEffects();
        }

        updateDisplay(rawGal, filteredGal, currentShindo);
    });
}
var alarmInterval = null;
function triggerAlarm() {
    document.body.classList.add('alarm-active');
    if (navigator.vibrate) navigator.vibrate(200);

    if (!alarmInterval) {
        playBeep();
        alarmInterval = setInterval(playBeep, 500);
    }
}

function stopAlarmEffects() {
    document.body.classList.remove('alarm-active');
    if (alarmInterval) {
        clearInterval(alarmInterval);
        alarmInterval = null;
    }
}

function playBeep() {
    if (!audioCtx || config.volume === 0) return;
    try {
        var osc = audioCtx.createOscillator();
        var gainNode = audioCtx.createGain();
        
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(987.77, audioCtx.currentTime); 
        gainNode.gain.setValueAtTime(config.volume, audioCtx.currentTime);
        
        osc.start();
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        osc.stop(audioCtx.currentTime + 0.25);
    } catch(e) { console.error(e); }
}

function testAlertAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    playBeep();
}

function drawGraph() {
    if (!isSystemRunning) return;
    
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = 120;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // 背景の補助グリッド線の描画
    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 1;
    for (var i = 1; i < 4; i++) {
        var y = (canvas.height / 4) * i;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    // 地震動ラインを手動プロット（バグの起きない安全描画ループ）
    ctx.beginPath();
    ctx.strokeStyle = '#007bff';
    ctx.lineWidth = 2;
    
    var sliceWidth = canvas.width / 49;
    
    // 各独立変数の値を安全にグラフに描画
    ctx.moveTo(0 * sliceWidth, canvas.height - (Math.min(g0, 50) / 50 * canvas.height));
    ctx.lineTo(1 * sliceWidth, canvas.height - (Math.min(g1, 50) / 50 * canvas.height));
    ctx.lineTo(2 * sliceWidth, canvas.height - (Math.min(g2, 50) / 50 * canvas.height));
    ctx.lineTo(3 * sliceWidth, canvas.height - (Math.min(g3, 50) / 50 * canvas.height));
    ctx.lineTo(4 * sliceWidth, canvas.height - (Math.min(g4, 50) / 50 * canvas.height));
    ctx.lineTo(5 * sliceWidth, canvas.height - (Math.min(g5, 50) / 50 * canvas.height));
    ctx.lineTo(6 * sliceWidth, canvas.height - (Math.min(g6, 50) / 50 * canvas.height));
    ctx.lineTo(7 * sliceWidth, canvas.height - (Math.min(g7, 50) / 50 * canvas.height));
    ctx.lineTo(8 * sliceWidth, canvas.height - (Math.min(g8, 50) / 50 * canvas.height));
    ctx.lineTo(9 * sliceWidth, canvas.height - (Math.min(g9, 50) / 50 * canvas.height));
    ctx.lineTo(10 * sliceWidth, canvas.height - (Math.min(g10, 50) / 50 * canvas.height));
    ctx.lineTo(11 * sliceWidth, canvas.height - (Math.min(g11, 50) / 50 * canvas.height));
    ctx.lineTo(12 * sliceWidth, canvas.height - (Math.min(g12, 50) / 50 * canvas.height));
    ctx.lineTo(13 * sliceWidth, canvas.height - (Math.min(g13, 50) / 50 * canvas.height));
    ctx.lineTo(14 * sliceWidth, canvas.height - (Math.min(g14, 50) / 50 * canvas.height));
    ctx.lineTo(15 * sliceWidth, canvas.height - (Math.min(g15, 50) / 50 * canvas.height));
    ctx.lineTo(16 * sliceWidth, canvas.height - (Math.min(g16, 50) / 50 * canvas.height));
    ctx.lineTo(17 * sliceWidth, canvas.height - (Math.min(g17, 50) / 50 * canvas.height));
    ctx.lineTo(18 * sliceWidth, canvas.height - (Math.min(g18, 50) / 50 * canvas.height));
    ctx.lineTo(19 * sliceWidth, canvas.height - (Math.min(g19, 50) / 50 * canvas.height));
    ctx.lineTo(20 * sliceWidth, canvas.height - (Math.min(g20, 50) / 50 * canvas.height));
    ctx.lineTo(21 * sliceWidth, canvas.height - (Math.min(g21, 50) / 50 * canvas.height));
    ctx.lineTo(22 * sliceWidth, canvas.height - (Math.min(g22, 50) / 50 * canvas.height));
    ctx.lineTo(23 * sliceWidth, canvas.height - (Math.min(g23, 50) / 50 * canvas.height));
    ctx.lineTo(24 * sliceWidth, canvas.height - (Math.min(g24, 50) / 50 * canvas.height));
    ctx.lineTo(25 * sliceWidth, canvas.height - (Math.min(g25, 50) / 50 * canvas.height));
    ctx.lineTo(26 * sliceWidth, canvas.height - (Math.min(g26, 50) / 50 * canvas.height));
    ctx.lineTo(27 * sliceWidth, canvas.height - (Math.min(g27, 50) / 50 * canvas.height));
    ctx.lineTo(28 * sliceWidth, canvas.height - (Math.min(g28, 50) / 50 * canvas.height));
    ctx.lineTo(29 * sliceWidth, canvas.height - (Math.min(g29, 50) / 50 * canvas.height));
    ctx.lineTo(30 * sliceWidth, canvas.height - (Math.min(g30, 50) / 50 * canvas.height));
    ctx.lineTo(31 * sliceWidth, canvas.height - (Math.min(g31, 50) / 50 * canvas.height));
    ctx.lineTo(32 * sliceWidth, canvas.height - (Math.min(g32, 50) / 50 * canvas.height));
    ctx.lineTo(33 * sliceWidth, canvas.height - (Math.min(g33, 50) / 50 * canvas.height));
    ctx.lineTo(34 * sliceWidth, canvas.height - (Math.min(g34, 50) / 50 * canvas.height));
    ctx.lineTo(35 * sliceWidth, canvas.height - (Math.min(g35, 50) / 50 * canvas.height));
    ctx.lineTo(36 * sliceWidth, canvas.height - (Math.min(g36, 50) / 50 * canvas.height));
    ctx.lineTo(37 * sliceWidth, canvas.height - (Math.min(g37, 50) / 50 * canvas.height));
    ctx.lineTo(38 * sliceWidth, canvas.height - (Math.min(g38, 50) / 50 * canvas.height));
    ctx.lineTo(39 * sliceWidth, canvas.height - (Math.min(g39, 50) / 50 * canvas.height));
    ctx.lineTo(40 * sliceWidth, canvas.height - (Math.min(g40, 50) / 50 * canvas.height));
    ctx.lineTo(41 * sliceWidth, canvas.height - (Math.min(g41, 50) / 50 * canvas.height));
    ctx.lineTo(42 * sliceWidth, canvas.height - (Math.min(g42, 50) / 50 * canvas.height));
    ctx.lineTo(43 * sliceWidth, canvas.height - (Math.min(g43, 50) / 50 * canvas.height));
    ctx.lineTo(44 * sliceWidth, canvas.height - (Math.min(g44, 50) / 50 * canvas.height));
    ctx.lineTo(45 * sliceWidth, canvas.height - (Math.min(g45, 50) / 50 * canvas.height));
    ctx.lineTo(46 * sliceWidth, canvas.height - (Math.min(g46, 50) / 50 * canvas.height));
    ctx.lineTo(47 * sliceWidth, canvas.height - (Math.min(g47, 50) / 50 * canvas.height));
    ctx.lineTo(48 * sliceWidth, canvas.height - (Math.min(g48, 50) / 50 * canvas.height));
    ctx.lineTo(49 * sliceWidth, canvas.height - (Math.min(g49, 50) / 50 * canvas.height));
    ctx.stroke();

    requestAnimationFrame(drawGraph);
}

function updateDisplay(rawGal, filteredGal, shindo) {
    if (rawGal >= 0) document.getElementById('raw-gal').innerText = rawGal.toFixed(2);
    if (filteredGal >= 0) document.getElementById('filtered-gal').innerText = filteredGal.toFixed(2);

    var shindoStr = "--";
    var classStr = "0";

    if (shindo < 0.5) { shindoStr = "0.0"; classStr = "0"; }
    else if (shindo < 1.5) { shindoStr = shindo.toFixed(1); classStr = "1"; }
    else if (shindo < 2.5) { shindoStr = shindo.toFixed(1); classStr = "2"; }
    else if (shindo < 3.5) { shindoStr = shindo.toFixed(1); classStr = "3"; }
    else if (shindo < 4.5) { shindoStr = shindo.toFixed(1); classStr = "4"; }
    else if (shindo < 5.0) { shindoStr = shindo.toFixed(1); classStr = "5弱"; }
    else if (shindo < 5.5) { shindoStr = shindo.toFixed(1); classStr = "5強"; }
    else if (shindo < 6.0) { shindoStr = shindo.toFixed(1); classStr = "6弱"; }
    else if (shindo < 6.5) { shindoStr = shindo.toFixed(1); classStr = "6強"; }
    else { shindoStr = shindo.toFixed(1); classStr = "7"; }

    if (shindo <= -0.5) {
        document.getElementById('shindo-class').innerText = "-";
        document.getElementById('shindo-val').innerText = "計測震度: --";
    } else {
        document.getElementById('shindo-class').innerText = classStr;
        document.getElementById('shindo-val').innerText = "計測震度: " + shindoStr;
    }
}
</script>
</body>
</html>
