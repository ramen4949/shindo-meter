<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タイピング対応・簡易震度計</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            background-color: #f4f6f9;
            padding: 20px;
            margin: 0;
            color: #333;
        }
        .container {
            max-width: 420px;
            margin: 20px auto;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }
        h2 { margin-top: 0; font-size: 22px; color: #222; }
        button {
            font-size: 16px;
            padding: 14px 28px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(40,167,69,0.3);
            transition: all 0.2s;
        }
        button:active { transform: scale(0.98); }
        .result-box {
            margin: 25px 0;
            padding: 20px;
            background: #fafafa;
            border-radius: 12px;
            border: 1px solid #eee;
        }
        .label { font-size: 14px; color: #666; font-weight: 500; }
        #shindo {
            font-size: 72px;
            font-weight: 900;
            color: #222;
            margin: 10px 0;
            line-height: 1;
        }
        .metrics {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            font-size: 13px;
            color: #555;
            border-top: 1px dashed #ddd;
            padding-top: 12px;
        }
        .metric-val { font-weight: bold; color: #111; font-size: 15px; display: block; margin-top: 4px;}
        .info {
            font-size: 11px;
            color: #888;
            margin-top: 20px;
            text-align: left;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>簡易震度計 (タイピング振動除去版)</h2>
    <p style="font-size: 14px; color: #666;">キーボードの近くに置いたまま計測できます。</p>
    
    <button id="start-btn" onclick="requestPermission()">計測を開始する</button>

    <div class="result-box">
        <span class="label">推定震度</span>
        <div id="shindo">-</div>
        
        <div class="metrics">
            <div>瞬間最大Gal<span id="instant-gal" class="metric-val">0.00</span></div>
            <div>判定用有効Gal<span id="valid-gal" class="metric-val">0.00</span></div>
        </div>
    </div>

    <div class="info">
        【タイピング対策適用済み】<br>
        ・強力な低周波フィルターにより、キーボードの打鍵によるカタカタした高周波振動を完全に無視します。<br>
        ・机がゆっくり、大きく「グラグラ」と1秒以上揺れたときのみ反応する設計です。
    </div>
</div>

<script>
const SAMPLING_INTERVAL = 100; // 0.1秒ごとに処理
const DURATION_SAMPLES = 5;    // 過去0.5秒間（5サンプル）の継続性をチェック

let rawAccBuffer = [];
let galHistory = [];
let maxValidGal = 0;

// 強力なローパスフィルター（タイピングなどの激しいノイズをカット）
let fX = 0, fY = 0, fZ = 0;
const alpha = 0.04; // 0.4から0.04へ超強化。これで細かい高速振動は完全に消え去ります
const DEAD_ZONE = 1.5; // この値（gal）以下の微小な振動はノイズとしてゼロにします

// 緩やかな減衰処理
setInterval(() => {
    maxValidGal = maxValidGal * 0.8;
    if (maxValidGal < 0.5) maxValidGal = 0;
    updateDisplay(0, maxValidGal);
}, 1000);

function requestPermission() {
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        DeviceMotionEvent.requestPermission()
            .then(permissionState => {
                if (permissionState === 'granted') { startTracking(); } 
                else { alert('センサーの利用が拒否されました。'); }
            }).catch(console.error);
    } else {
        startTracking();
    }
}

function startTracking() {
    document.getElementById('start-btn').style.display = 'none';

    window.addEventListener('devicemotion', (event) => {
        let x = event.acceleration.x || 0;
        let y = event.acceleration.y || 0;
        let z = event.acceleration.z || 0;

        // 超強力ローパスフィルターの適用
        fX = alpha * x + (1 - alpha) * fX;
        fY = alpha * y + (1 - alpha) * fY;
        fZ = alpha * z + (1 - alpha) * fZ;

        let acc = Math.sqrt(fX*fX + fY*fY + fZ*fZ);
        let gal = acc * 100;

        // 不感帯処理：一定以下の細かい揺れは完全にカット
        if (gal < DEAD_ZONE) gal = 0;

        rawAccBuffer.push(gal);
    });

    setInterval(() => {
        if (rawAccBuffer.length === 0) {
            // 揺れがないときは履歴に0を追加
            galHistory.push(0);
        } else {
            let sum = rawAccBuffer.reduce((a, b) => a + b, 0);
            let avgGal = sum / rawAccBuffer.length;
            rawAccBuffer = [];
            galHistory.push(avgGal);
        }

        if (galHistory.length > DURATION_SAMPLES) {
            galHistory.shift();
        }

        // 継続時間ルール：過去0.5秒（5サンプル）の履歴を昇順ソート
        // 中位の値（3番目）を有効Galとすることで突発ノイズを排除
        let sortedHistory = [...galHistory].sort((a, b) => a - b);
        let validGal = sortedHistory[2] || 0; 

        if (validGal > maxValidGal) {
            maxValidGal = validGal;
        }

        // 画面表示用の瞬間値は直近の平均
        let instantMax = galHistory[galHistory.length - 1] || 0;

        updateDisplay(instantMax, maxValidGal);
    }, SAMPLING_INTERVAL);
}

function updateDisplay(instant, valid) {
    // フィルター強化に合わせて、実用的な震度しきい値に調整
    let shindo = "0";
    if (valid >= 0.3)  shindo = "1";
    if (valid >= 1.2)  shindo = "2";
    if (valid >= 4.0)  shindo = "3";
    if (valid >= 10.0) shindo = "4";
    if (valid >= 25.0) shindo = "5弱";
    if (valid >= 50.0) shindo = "5強";
    if (valid >= 90.0) shindo = "6弱";
    if (valid >= 150.0) shindo = "6強";
    if (valid >= 250.0) shindo = "7";

    document.getElementById('instant-gal').innerText = instant.toFixed(2);
    document.getElementById('valid-gal').innerText = valid.toFixed(2);
    document.getElementById('shindo').innerText = shindo;
}
</script>

</body>
</html>
