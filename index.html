<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高度・簡易震度計測計</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            background-color: #f4f6f9;
            padding: 20px;
            margin: 0;
            color: #333;
        }
        .container {
            max-width: 420px;
            margin: 20px auto;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }
        h2 { margin-top: 0; font-size: 22px; color: #222; }
        button {
            font-size: 16px;
            padding: 14px 28px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(0,123,255,0.3);
            transition: all 0.2s;
        }
        button:active { transform: scale(0.98); }
        .result-box {
            margin: 25px 0;
            padding: 20px;
            background: #fafafa;
            border-radius: 12px;
            border: 1px solid #eee;
        }
        .label { font-size: 14px; color: #666; font-weight: 500; }
        #shindo {
            font-size: 72px;
            font-weight: 900;
            color: #222;
            margin: 10px 0;
            line-height: 1;
        }
        .metrics {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            font-size: 13px;
            color: #555;
            border-top: 1px dashed #ddd;
            padding-top: 12px;
        }
        .metric-val { font-weight: bold; color: #111; font-size: 15px; display: block; margin-top: 4px;}
        .info {
            font-size: 11px;
            color: #888;
            margin-top: 20px;
            text-align: left;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>簡易震度計 (ノイズフィルタ搭載)</h2>
    <p style="font-size: 14px; color: #666;">スマホを机の上に水平に置いて計測してください。</p>
    
    <button id="start-btn" onclick="requestPermission()">計測を開始する</button>

    <div class="result-box">
        <span class="label">推定震度</span>
        <div id="shindo">-</div>
        
        <div class="metrics">
            <div>瞬間最大Gal<span id="instant-gal" class="metric-val">0.00</span></div>
            <div>判定用有効Gal<span id="valid-gal" class="metric-val">0.00</span></div>
        </div>
    </div>

    <div class="info">
        【仕組みと注意点】<br>
        ・一瞬の衝突による誤検知を防ぐため、過去0.3秒間で「3番目に大きかった振動（気象庁の継続時間ルールを応用）」を判定に使用しています。<br>
        ・高周波ノイズをカットするデジタルフィルタを適用しています。<br>
        ・実際の気象庁の正確な計測震度とは異なりますので、目安としてお使いください。
    </div>
</div>

<script>
// 設定値
const SAMPLING_INTERVAL = 100; // サンプリング周期 (100ms = 0.1秒)
const DURATION_SAMPLES = 3;    // 0.3秒を表現するサンプル数 (3 × 100ms)

// 状態変数
let rawAccBuffer = [];
let galHistory = [];
let maxValidGal = 0;

// フィルター用変数（簡易ローパスフィルター係数）
let fX = 0, fY = 0, fZ = 0;
const alpha = 0.4; // 0〜1の値。小さいほど滑らか（ノイズカット）になり、大きいほど追従性が上がります

// 最大判定Galの定期的な減衰処理（5秒かけて徐々に減衰）
setInterval(() => {
    maxValidGal = maxValidGal * 0.85;
    if (maxValidGal < 0.5) maxValidGal = 0;
    updateDisplay(0, maxValidGal);
}, 1000);

function requestPermission() {
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        DeviceMotionEvent.requestPermission()
            .then(permissionState => {
                if (permissionState === 'granted') { startTracking(); } 
                else { alert('センサーの利用が拒否されました。'); }
            }).catch(console.error);
    } else {
        startTracking();
    }
}

function startTracking() {
    document.getElementById('start-btn').style.display = 'none';

    // 1. デバイスの生データを高速収集
    window.addEventListener('devicemotion', (event) => {
        let x = event.acceleration.x || 0;
        let y = event.acceleration.y || 0;
        let z = event.acceleration.z || 0;

        // ローパスフィルターを適用して瞬間的なトゲを消す
        fX = alpha * x + (1 - alpha) * fX;
        fY = alpha * y + (1 - alpha) * fY;
        fZ = alpha * z + (1 - alpha) * fZ;

        let acc = Math.sqrt(fX*fX + fY*fY + fZ*fZ);
        let gal = acc * 100; // m/s^2 から gal へ変換

        rawAccBuffer.push(gal);
    });

    // 2. 0.1秒（100ms）ごとにデータをまとめて区切り処理を行う（高速リフレッシュ）
    setInterval(() => {
        if (rawAccBuffer.length === 0) return;

        // この100ms間の平均Galを算出
        let sum = rawAccBuffer.reduce((a, b) => a + b, 0);
        let avgGal = sum / rawAccBuffer.length;
        rawAccBuffer = []; // バッファクリア

        // 瞬間的な最大値を画面表示用に保存
        let instantMax = avgGal;

        // 過去0.3秒分（3サンプル分）の履歴を管理
        galHistory.push(avgGal);
        if (galHistory.length > DURATION_SAMPLES) {
            galHistory.shift();
        }

        // 気象庁ルール：過去0.3秒（3個のデータ）の中で「3番目に大きい値」を有効な揺れとする
        // 今回は要素数が3個なので、昇順ソートしたときの1番最初の値（最小値）が「3番目に大きい値」になります
        let sortedHistory = [...galHistory].sort((a, b) => a - b);
        let validGal = sortedHistory[0] || 0;

        // 有効Galの最高値を更新
        if (validGal > maxValidGal) {
            maxValidGal = validGal;
        }

        updateDisplay(instantMax, maxValidGal);
    }, SAMPLING_INTERVAL);
}

function updateDisplay(instant, valid) {
    // 震度基準（気象庁の計算式に則った実用的なしきい値に調整）
    let shindo = "0";
    if (valid >= 0.8)  shindo = "1";
    if (valid >= 2.5)  shindo = "2";
    if (valid >= 8.0)  shindo = "3";
    if (valid >= 25.0) shindo = "4";
    if (valid >= 80.0) shindo = "5弱";
    if (valid >= 140.0) shindo = "5強";
    if (valid >= 250.0) shindo = "6弱";
    if (valid >= 400.0) shindo = "6強";
    if (valid >= 830.0) shindo = "7";

    document.getElementById('instant-gal').innerText = instant.toFixed(2);
    document.getElementById('valid-gal').innerText = valid.toFixed(2);
    document.getElementById('shindo').innerText = shindo;
}
</script>

</body>
</html>
